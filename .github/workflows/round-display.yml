name: Round display firmware

on:
  push:
    branches: [round-display]
  pull_request:
    paths: ['firmware/**', 'core/**', 'scripts/*round*', '.github/workflows/round-display.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: round-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policies:
    name: Round policy and diagnostics tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: cmake -S . -B work/round-policy -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build work/round-policy --parallel 2
      - run: ctest --test-dir work/round-policy --output-on-failure
  round:
    name: ESP-IDF 6.1 Spotpear round profile
    needs: policies
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build isolated round profile
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python -m pip install -r scripts/requirements-test.txt
          idf.py -C firmware -B "$GITHUB_WORKSPACE/work/round-build" -DIDF_TARGET=esp32s3 -DSDKCONFIG="$GITHUB_WORKSPACE/work/round-build/sdkconfig" -D"SDKCONFIG_DEFAULTS=$GITHUB_WORKSPACE/firmware/sdkconfig.defaults;$GITHUB_WORKSPACE/firmware/round/sdkconfig.defaults" -DAIRBRIDGE_ROUND_DISPLAY=ON -DAIRBRIDGE_PUBLIC_BUILD=ON -DAIRBRIDGE_PRESENCE_TX=ON -DAIRBRIDGE_IPV6_LINK=ON -DAIRBRIDGE_NATIVE_SERVICE=ON -DAIRBRIDGE_RAW_RATE_1M=ON build
          python scripts/package-round-firmware.py --build work/round-build --tag "v$(cat VERSION)" --commit "$GITHUB_SHA" --output work/round-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp32s3-round-display
          path: work/round-release/*
          if-no-files-found: error
          retention-days: 14
