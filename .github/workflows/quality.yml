name: Quality suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web and Chromium acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: |
            desktop/playwright-report/
            desktop/test-results/
          retention-days: 14
      - name: Retain tested web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-web
          path: desktop/dist/
          if-no-files-found: error
          retention-days: 7

  native:
    name: Protocol and Windows host
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: cmake -S . -B work/ci -A x64
      - run: cmake --build work/ci --config Release
      - run: ctest --test-dir work/ci -C Release --output-on-failure
      - run: rustup show active-toolchain
      - run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
      - run: cargo test --manifest-path desktop/Cargo.toml --workspace --locked

  quality-gate:
    name: Quality gate
    if: always()
    needs: [web, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every suite to succeed
        env:
          WEB_RESULT: ${{ needs.web.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$WEB_RESULT" = success
          test "$NATIVE_RESULT" = success
