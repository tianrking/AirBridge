<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AirBridge · Automated failure acceptance</title>
    <style>
      body {
        margin: 0;
        font: 13px system-ui;
        background: #f4f6f9;
        color: #314760;
      }
      .test-bar {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 22px;
        background: #fff;
        border-bottom: 1px solid #dde5ef;
      }
      .test-bar button {
        padding: 9px 15px;
        border: 0;
        border-radius: 9px;
        background: #216fdb;
        color: white;
        cursor: pointer;
      }
      .test-bar span {
        font-size: 11px;
        color: #64758b;
      }
      #result {
        white-space: pre-wrap;
        padding: 18px 24px;
        font:
          12px/1.7 Consolas,
          monospace;
      }
      #fixture .app-shell {
        height: calc(100vh - 220px);
      }
    </style>
  </head>
  <body>
    <header class="test-bar">
      <strong>Automated failure acceptance</strong
      ><span
        >Synthetic serial · Real browser storage · No hardware / AirDrop</span
      ><button id="run">Run automated failure checks</button>
    </header>
    <pre id="result" role="status">Ready. No hardware will be opened.</pre>
    <div id="fixture"></div>
    <script type="module" src="./failures.tsx"></script>
  </body>
</html>
